name: Rebuild CV PDF

on:
  push:
    branches:
      - main
    paths:
      - ref.bib
      - tex/cv.tex
      - tex/latexmkrc
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          working_directory: tex
          args: -g -pdfdvi -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tex/cv.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: rebuild CV PDF"
          git push
